services:
  face-meta:
    build: .
    image: face-meta:latest
    container_name: face-meta
    restart: unless-stopped
    ports:
      # 루프백 바인딩. 호스트 IP 를 생략하면 Docker 가 0.0.0.0 을 붙여 LAN 의
      # 모든 기기가 Cloudflare 를 우회해 직접 닿는다 — 엣지의 WAF·레이트리밋이
      # 무의미해진다. 유일한 인바운드 경로는 같은 호스트의 cloudflared 이며
      # ingress 가 meta.facely.kr → http://localhost:8000 으로 넘긴다.
      - '127.0.0.1:8000:8000'
    environment:
      - LOG_LEVEL=INFO
      - MAX_DOWNLOAD_MB=10
      - DOWNLOAD_TIMEOUT_SEC=15
      - DETECTOR_BACKEND=opencv
      # HMAC shared secret — 반드시 Cloudflare Worker FACE_API_SECRET 와 동일.
      # 운영에선 .env 또는 docker secret 로 주입 (이 파일에 직접 박지 말 것).
      - FACE_API_SECRET=${FACE_API_SECRET}
      # R2 — Worker 와 동일 토큰 공유 (HOW-IT-WORKS §6.2). temp/ 즉시 DELETE 용.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    volumes:
      # DeepFace 가중치(약 1.6GB)를 컨테이너 밖에 둔다. 컨테이너 레이어에 두면
      # `docker compose up` 이 컨테이너를 recreate 할 때마다 통째로 다시
      # 받는다 — 실측 3분간 502 였다. DEEPFACE_HOME 은 Dockerfile 이 정한다.
      - face-meta-models:/app/.deepface
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      # 첫 기동은 가중치를 받느라 오래 걸린다(실측 약 3분). 볼륨이 붙은 뒤로는
      # 재기동이 빠르지만, 볼륨이 비어 있는 최초 1회를 견딜 만큼은 줘야
      # 컨테이너가 unhealthy 로 잘못 표시되지 않는다.
      start_period: 300s

volumes:
  face-meta-models:
