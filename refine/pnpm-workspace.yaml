# 단일 프로젝트라 packages 목록은 필요 없지만, pnpm 11 부터 설정의 자리가
# package.json 의 "pnpm" 필드에서 이 파일로 옮겨졌다.

# pnpm 11 은 node_modules 를 지워야 할 때 확인을 묻고, TTY 가 없으면 중단한다.
confirmModulesPurge: false

# 설치 시 어떤 패키지의 빌드 스크립트를 돌릴지. pnpm 11 은 기본으로 전부 막고,
# 명시하지 않으면 ERR_PNPM_IGNORED_BUILDS 로 설치 자체가 실패한다.
allowBuilds:
  esbuild: true # 플랫폼별 바이너리 배치
