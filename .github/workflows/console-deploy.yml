name: Deploy Console to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'refine/**'
      # face_engine.js 는 refine/ 안에 있지만 gitignore 되고 shared/ 의 Dart
      # 소스에서 생성된다. Dart 를 고치면 refine/ 은 안 바뀌므로 여기도 본다.
      - 'shared/**'
      - '.github/workflows/console-deploy.yml'
  workflow_dispatch:

# console.facely.kr — refine 관리자 콘솔. 서버 코드가 없는 정적 SPA 라
# Workers 의 정적 자산 기능만 쓴다 (refine/wrangler.jsonc).
#
# ⚠️ 이 번들에는 Supabase service_role 키가 박힌다 (providers/constants.ts).
# RLS 를 우회하는 전권 키이므로 반드시 Cloudflare Access 로 막은 뒤에만
# 공개 상태로 두어야 한다. 키를 걷어내는 작업은 별도로 진행한다.
jobs:
  deploy:
    name: Build and Deploy facely console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 이 리포는 루트 package.json 이 없다(web·refine 이 각각 독립 프로젝트).
      # 지정하지 않으면 action 이 루트에서 packageManager 를 찾다 실패한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: refine/package.json

      # web 과 마찬가지로 src/lib/shared/face_engine.js 가 gitignore 되어 리포에
      # 없다. src/lib/share-engine.ts 가 이걸 import 하므로 없으면 rollup 이
      # 모듈을 못 찾아 빌드가 깨진다. 출력 경로만 web 과 다르고 생성 방법은 같다.
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'

      - name: Install dependencies
        working-directory: refine
        run: pnpm install --frozen-lockfile

      - name: Compile shared Dart engine
        working-directory: refine
        run: pnpm build:shared

      # Vite 는 VITE_* 를 빌드 시점에 번들로 인라인한다. 러너에는 .env 가 없으므로
      # 여기서 주입하지 않으면 값이 빈 문자열로 박혀 콘솔이 Supabase 에 붙지 못한다.
      - name: Build
        working-directory: refine
        env:
          VITE_SUPABASE_URL: ${{ secrets.CONSOLE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.CONSOLE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.CONSOLE_SUPABASE_SERVICE_KEY }}
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        working-directory: refine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler deploy
