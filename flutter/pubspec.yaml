name: facely
description: '관상은 과학이다 — 안면 계측 데이터 기반 인공지능 관상앱'
publish_to: 'none'

version: 1.0.3+17

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  camera: ^0.12.0
  mediapipe_face_mesh: ^2.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  google_mlkit_face_detection: ^0.14.0
  http: ^1.6.0
  crypto: ^3.0.7

  # State Management
  flutter_riverpod: ^3.4.1

  # HTTP
  dio: ^5.11.0

  # Routing
  go_router: ^17.3.0

  # Freezed
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Supabase
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  uuid: ^4.6.0
  timeago: ^3.7.1
  purchases_flutter: ^10.4.3
  package_info_plus: ^10.2.1
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.3
  concentric_transition: ^1.0.3
  flutter_image_compress: ^2.5.1
  top_snackbar_flutter: ^3.3.0
  kakao_flutter_sdk: ^2.0.0+1
  sign_in_with_apple: ^8.1.0
  tflite_flutter: ^0.12.1
  share_plus: ^13.3.0
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  google_mobile_ads: ^9.0.0
  qr_flutter: ^4.1.0

  # Shared physiognomy engine (also consumed by web/ via dart compile js).
  face_engine:
    path: ../shared
  sentry: ^9.25.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  # 2.15.2 는 analyzer ≥13.3(meta ^1.18.3) 요구 — 현 Flutter stable 의
  # flutter_test 가 meta 1.18.0 고정이라 불가. stable 조합 최신은 2.15.1.
  build_runner: ^2.15.1
  flutter_launcher_icons: '^0.14.4'
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icons/icon.png'
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

# native splash 는 백지(흰색) placeholder — 수묵화·타이틀은 in-app 스플래시
# (main.dart BootstrapApp) 로 이주. PIVOT.md A5 스플래시 스펙.
# Android 12+ 는 OS 가 앱 아이콘을 스플래시에 강제로 그리므로, 투명 PNG 로
# 아이콘 자리를 비워 시스템 스플래시를 순수 백지로 만든다 — 사용자 눈에는
# in-app 수묵화 스플래시가 첫 화면. (아이콘→수묵화 2단 갈아끼움 제거)
flutter_native_splash:
  android: true
  ios: true

  color: '#FFFFFF'
  color_dark: '#FFFFFF'

  android_12:
    color: '#FFFFFF'
    color_dark: '#FFFFFF'
    image: 'assets/images/transparent.png'

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/svgs/
    - assets/ml/
    - assets/fonts/NotoSerifKR-Regular.ttf
    - assets/fonts/NotoSerifKR-Bold.ttf
  fonts:
    - family: SongMyung
      fonts:
        - asset: assets/fonts/SongMyung-Regular.ttf
